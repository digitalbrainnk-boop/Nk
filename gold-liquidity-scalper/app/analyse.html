<title>Analyse Gold Liquidity Scalper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : bandeau collant (marque, source des données, onglets), puis une colonne de sections ;
   tableaux larges et graphiques dans leurs propres conteneurs. Teinte d'accent : laiton (l'or du sujet). */
:root{
  --bg:#f1f2f4; --panel:#ffffff; --panel-2:#e8eaee; --ink:#14171c; --ink-2:#454b56; --ink-3:#69707c; --line:#d6d9df;
  --gold:#86620f; --gold-ink:#ffffff; --gold-soft:#f4ead0;
  --pos:#2a78d6; --neg:#e34948;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#0a6a0a; --warn-ink:#7d5200; --crit-ink:#b02e2e;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --panel:#171a1f; --panel-2:#21252c; --ink:#eceef2; --ink-2:#b5bbc5; --ink-3:#8b919c; --line:#2d323b;
    --gold:#d8b24a; --gold-ink:#17130a; --gold-soft:#372f1d;
    --pos:#3987e5; --neg:#e66767;
    --good-ink:#62d262; --warn-ink:#fab219; --crit-ink:#ff8d8d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --panel:#171a1f; --panel-2:#21252c; --ink:#eceef2; --ink-2:#b5bbc5; --ink-3:#8b919c; --line:#2d323b;
  --gold:#d8b24a; --gold-ink:#17130a; --gold-soft:#372f1d;
  --pos:#3987e5; --neg:#e66767;
  --good-ink:#62d262; --warn-ink:#fab219; --crit-ink:#ff8d8d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
table{font-size:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{display:grid;place-items:center;width:42px;height:42px;border:1.5px solid var(--gold);border-radius:6px;color:var(--gold);font:700 17px/1 var(--font-display);position:relative;flex:none}
.mark small{position:absolute;top:3px;left:4px;font:500 8px/1 var(--font-data);color:var(--ink-3)}
.b1{font:700 18px/1.15 var(--font-display);letter-spacing:-.01em}
.b2{font-size:12.5px;color:var(--ink-3)}
.top-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font:500 14px var(--font-body);padding:9px 12px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* contrôles */
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;font:500 14px var(--font-body);padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.danger{color:var(--crit-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select,input[type="date"],input[type="number"]{font:14px var(--font-body);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--ink-3);font:500 13px var(--font-body);padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}

/* structure */
main{padding-block:16px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{font:600 15.5px/1.3 var(--font-display);margin-bottom:10px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head h3{margin:0}
.hint{font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3);flex:1 1 130px;min-width:0}
.f.btnf{flex:0 0 auto}
.note{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.note.err{border-color:var(--crit);color:var(--crit-ink)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--gold);background:var(--gold-soft);font-size:14px}
.banner b{font-weight:600}
.banner.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.banner .bi{font:700 13px/20px var(--font-data);flex:none}

/* indicateurs */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font:600 25px/1.1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font:500 13px var(--font-body);color:var(--ink-3)}
.tile .s{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12px;line-height:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);white-space:nowrap;width:max-content;max-width:100%}
.pill.good{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 11%,var(--panel))}
.pill.warn{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 13%,var(--panel))}
.pill.crit{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 50%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--panel))}
.pill.gold{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}

/* tableaux */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--ink-3);font-size:12px;text-align:left;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;vertical-align:bottom}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--font-data);font-size:12.5px;white-space:nowrap}
.tbl th.num{font-family:var(--font-body);font-size:12px}
.tbl .k{max-width:260px;overflow-wrap:anywhere}
.tbl tr.thin td{color:var(--ink-3)}
.tbl .posv{color:var(--pos)}
.tbl .negv{color:var(--neg)}
.bc{display:flex;align-items:center;gap:8px;min-width:150px}
.db{position:relative;flex:1;height:10px;min-width:64px;background:var(--panel-2);border-radius:3px}
.db::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.db i{position:absolute;top:0;bottom:0;border-radius:2px}
.db i.pos{background:var(--pos)}
.db i.neg{background:var(--neg)}
.bc b{font:500 12.5px var(--font-data);min-width:48px;text-align:right}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,2fr) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hb .lab{overflow-wrap:anywhere}
.hb .tr{height:12px;background:var(--panel-2);border-radius:3px;position:relative}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--pos);border-radius:0 3px 3px 0}
.hb .val{font:500 12.5px var(--font-data);text-align:right;white-space:nowrap}
details.crit-d{font-size:13px;margin-top:6px}
details.crit-d summary{cursor:pointer;color:var(--ink-2)}
.crit-l{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.crit-l li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.crit-l .ok{color:var(--good-ink);font-family:var(--font-data)}
.crit-l .ko{color:var(--crit-ink);font-family:var(--font-data)}
.mono{font-family:var(--font-data);font-size:12.5px}

/* graphiques */
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%}
.chart .ax{fill:var(--ink-3);font:11px var(--font-data)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .g0{stroke:var(--ink-3);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.pos{stroke:var(--pos)} .chart .ln.neg{stroke:var(--neg)}
.chart .ar.pos{fill:var(--pos);fill-opacity:.12} .chart .ar.neg{fill:var(--neg);fill-opacity:.16}
.chart .dot{stroke:var(--panel);stroke-width:2}
.chart .dot.pos{fill:var(--pos)} .chart .dot.neg{fill:var(--neg)}
.chart .xhl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .bar.pos{fill:var(--pos)} .chart .bar.neg{fill:var(--neg)}
.chart .hit{fill:transparent;cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.pos{background:var(--pos)} .legend i.neg{background:var(--neg)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.45 var(--font-data);padding:6px 9px;border-radius:6px;max-width:260px;white-space:pre-line}

/* fichiers */
.drop{border:1.5px dashed var(--ink-3);border-radius:12px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.drop p{margin:0;max-width:60ch;color:var(--ink-2)}
.flist{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.fi:last-child{border-bottom:0}
.fi .fn{font-weight:600;overflow-wrap:anywhere}
.fi .fm{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.fi .fa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.fi{grid-template-columns:minmax(0,1fr)}.fi .fa{justify-content:flex-start}}
.prose{max-width:68ch;color:var(--ink-2);font-size:14px}
.prose p{margin:0 0 8px}
.prose code,.mono-in{font-family:var(--font-data);font-size:12.5px;background:var(--panel-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font:600 17px var(--font-display);color:var(--ink);margin-bottom:6px}
.lecture{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.decision{border-left:3px solid var(--gold);padding:4px 0 4px 14px}
@media (prefers-reduced-motion: no-preference){.btn,.tab{transition:border-color .15s,color .15s,background-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <div class="mark" aria-hidden="true"><small>79</small>Au</div>
        <div>
          <div class="b1">Gold Liquidity Scalper</div>
          <div class="b2">Analyse des journaux du robot · XAU/USD</div>
        </div>
      </div>
      <div class="top-act">
        <span id="srcpill" class="pill"></span>
        <label class="btn primary" for="file-in">Ajouter des fichiers</label>
        <input id="file-in" class="vh" type="file" multiple accept=".csv,.txt,.json,text/csv,text/plain,application/json">
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap">
  <div class="stack">
    <div id="note" hidden></div>
    <div id="filters" class="card" hidden></div>
    <div id="view" class="stack"></div>
  </div>
</main>
<div id="tip" hidden></div>

<script>
(function () {
  'use strict';

  /* ===================== constantes ===================== */
  var CRITERIA_DEFAULT = {
    min_trades: { dev: 100, val: 50, test: 50 },
    min_expectancy_r: 0.05, min_profit_factor: 1.15, max_drawdown_r: 15.0,
    min_positive_period_ratio: 0.6, period: 'quarter', min_trades_per_period: 5,
    max_adjusted_p_value: 0.05, stress_extra_cost_price: 0.20, min_stressed_expectancy_r: 0.0,
    mc_paths: 1000, max_mc_drawdown_r_p95: 20.0
  };
  var NUMERIC = ['score', 'duration_s', 'entry', 'exit', 'volume', 'risk_money', 'risk_points', 'net', 'gross',
    'commission', 'swap', 'fee', 'r_multiple', 'slippage_pts', 'spread_pts', 'est_cost', 'mfe_r', 'mae_r', 'point'];
  var KIND_LABEL = { trades: 'Trades', signaux: 'Signaux', fvg: 'FVG', ob: 'Order Blocks', bougies: 'Bougies', journal: 'Journal', criteres: 'Critères' };
  var TABS = [['apercu', 'Vue d’ensemble'], ['trades', 'Trades'], ['signaux', 'Signaux'], ['zones', 'Zones FVG / OB'], ['protocole', 'Protocole'], ['fichiers', 'Fichiers']];
  var DATA_TABS = { apercu: 1, trades: 1, signaux: 1, zones: 1 };
  var FAMILY_NAME = { F1: 'Balayage de liquidité', F2: 'Tendance + pullback', F3: 'Cassure de range', F4: 'Compression / expansion', F5: 'Réaction sur S/R', F6: 'Retest de FVG' };
  var SPLIT_NAME = { dev: 'Développement', val: 'Validation', test: 'Test final hors échantillon' };
  var DAY = 864e5;

  /* ===================== état ===================== */
  var S = {
    ver: 0,
    files: [],
    filters: { env: '', family: '', label: '', dir: '', from: '', to: '' },
    tab: 'apercu',
    eqUnit: 'R',
    proto: { group: 'family', devFrom: '', devTo: '', valFrom: '', valTo: '', testFrom: '', testTo: '', unlock: false, variants: '', baseline: '' },
    cloud: { state: 'connexion', db: null, assets: null, user: null, uid: null, docs: [], loading: {}, errs: {}, first: false },
    notice: null,
    pendingDel: null
  };
  var CH = {};      // spécifications des graphiques affichés
  var seq = 0;
  function nid() { seq += 1; return 'f' + seq + '_' + Date.now().toString(36); }

  /* ===================== utilitaires ===================== */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(x, nd) {
    if (nd == null) nd = 2;
    if (x == null || (typeof x === 'number' && isNaN(x))) return 'n/d';
    if (x === Infinity) return '∞';
    if (x === -Infinity) return '−∞';
    return Number(x).toLocaleString('fr-FR', { minimumFractionDigits: nd, maximumFractionDigits: nd });
  }
  function sgn(x, nd) { if (typeof x !== 'number' || !isFinite(x)) return fmt(x, nd); return (x > 0 ? '+' : '') + fmt(x, nd); }
  function pct(x, nd) { return (x == null || isNaN(x)) ? 'n/d' : fmt(x, nd == null ? 1 : nd) + ' %'; }
  function int(x) { return Number(x).toLocaleString('fr-FR'); }
  function num(s) {
    if (s == null) return NaN;
    s = String(s).trim();
    if (!s) return NaN;
    if (s.indexOf(',') >= 0 && s.indexOf('.') < 0) s = s.replace(',', '.');
    s = s.replace(/[\s  ]/g, '');
    return Number(s);
  }
  function num0(s) { var v = num(s); return isFinite(v) ? v : 0; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    var m = /^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(s);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(s);
    if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    return null;
  }
  function dstr(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
  function dtstr(ms) { var d = new Date(ms); return dstr(ms) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); }
  function dayMs(str) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
  function uniq(a) { var o = {}, r = []; for (var i = 0; i < a.length; i++) { var k = a[i]; if (k == null || k === '') continue; if (!o[k]) { o[k] = 1; r.push(k); } } return r; }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function median(a) { if (!a.length) return NaN; var b = a.slice().sort(function (x, y) { return x - y; }); var h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; }
  function famLabel(f) { return FAMILY_NAME[f] ? f + ' · ' + FAMILY_NAME[f] : f; }

  /* ===================== statistiques (portage de tools/analyze_trades.py) ===================== */
  /*STATS-BEGIN*/
  function lgamma(x) {
    var c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
      12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1;
    var a = c[0], t = x + 7.5;
    for (var i = 1; i < 9; i++) a += c[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function betacf(a, b, x) {
    var qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    d = 1 / (Math.abs(d) > 1e-300 ? d : 1e-300);
    var h = d;
    for (var m = 1; m < 300; m++) {
      var m2 = 2 * m;
      var aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; d = 1 / (Math.abs(d) > 1e-300 ? d : 1e-300);
      c = 1 + aa / c; c = Math.abs(c) > 1e-300 ? c : 1e-300;

      chartHost('eq', CH.eq) + '<h3 style="margin:14px 0 4px;font-size:13.5px">Drawdown (recul depuis le plus haut cumulé)</h3>' + chartHost('dd', CH.dd) +

      var a = Math.max(lo, Math.floor(mn / w) * w), b = Math.min(hi, Math.ceil(mx / w + 1e-9) * w);
      if (b - a > 6) w = 0.5;
      a = Math.max(lo, Math.floor(mn / w) * w); b = Math.min(hi, Math.ceil(mx / w + 1e-9) * w); if (b <= a) b = a + w;

  /* ===================== protocole ===================== */
  function autoSplits(T) {
    var a = new Date(dstr(T[0].close) + 'T00:00:00Z').getTime(), b = new Date(dstr(T[T.length - 1].close) + 'T00:00:00Z').getTime();
    var span = Math.round((b - a) / DAY), c1 = a + Math.floor(span * 0.6) * DAY, c2 = a + Math.floor(span * 0.8) * DAY;
    return { devFrom: dstr(a), devTo: dstr(c1), valFrom: dstr(c1 + DAY), valTo: dstr(c2), testFrom: dstr(c2 + DAY), testTo: dstr(b) };
  }
  function filterVerdicts(res, groups, base, order, C) {
    return groups.filter(function (g) { return g !== base; }).map(function (g) {
      var reasons = [], deltas = [];
      order.forEach(function (s) {
        var m = (res[g + '@' + s] || {}).m || {}, r = (res[base + '@' + s] || {}).m || {}, n = m.n || 0, mn = C.min_trades[s] || 0;
        if (n < mn) reasons.push(s + ' : ' + n + ' trades < ' + mn);
        if (m.expectancy_r == null || r.expectancy_r == null) { reasons.push(s + ' : espérance indisponible'); deltas.push(NaN); return; }
        var dl = m.expectancy_r - r.expectancy_r; deltas.push(dl);
        if (!(dl > 0)) reasons.push(s + ' : écart d’espérance ' + fmt(dl) + ' R');
      });
      var mv = (res[g + '@val'] || {}).m || {};
      if (!(mv.stressed_expectancy_r > C.min_stressed_expectancy_r)) reasons.push('val : espérance sous stress ' + fmt(mv.stressed_expectancy_r == null ? NaN : mv.stressed_expectancy_r) + ' R');
      return { g: g, keep: !reasons.length, deltas: deltas, reasons: reasons };
    });
  }
  function viewProtocole() {
    var d = derive(), C = criteria(d), T = filtTrades(d, false), P = S.proto, h = banners(d);
    if (!T.length) return h + emptyState('Aucun trade pour le protocole', 'Ajoutez un ou plusieurs fichiers <span class="mono-in">_trades.csv</span>. Pour comparer des variantes, donnez à chaque passage un libellé distinct (paramètre <span class="mono-in">InpRunLabel</span>).');
    var auto = autoSplits(T), R = {};
    ['devFrom', 'devTo', 'valFrom', 'valTo', 'testFrom', 'testTo'].forEach(function (k) { R[k] = P[k] || auto[k]; });
    var gk = P.group === 'label' ? function (t) { return t.family + '|' + t.label; } : function (t) { return t.family; };
    var groups = uniq(T.map(gk)).sort(), nVar = P.variants ? Math.max(1, parseInt(P.variants, 10) || 1) : groups.length;
    var base = groups.indexOf(P.baseline) >= 0 ? P.baseline : '';
    function rangeIn(id, lab, a, b) {
      return '<div class="f"><span>' + lab + '</span><span style="display:flex;gap:6px;flex-wrap:wrap"><input type="date" id="p-' + id + 'From" value="' + esc(a) + '" aria-label="' + lab + ' : début"><input type="date" id="p-' + id + 'To" value="' + esc(b) + '" aria-label="' + lab + ' : fin"></span></div>';
    }
    h += '<section class="card"><div class="card-head"><h3>Réglages de l’étude</h3><span class="hint">à fixer avant de regarder les résultats</span></div><div class="filters">' +
      '<div class="f"><label for="p-group">Regroupement</label><select id="p-group"><option value="family"' + (P.group !== 'label' ? ' selected' : '') + '>par famille</option><option value="label"' + (P.group === 'label' ? ' selected' : '') + '>par famille et libellé (A/B)</option></select></div>' +
      rangeIn('dev', 'Développement', R.devFrom, R.devTo) + rangeIn('val', 'Validation', R.valFrom, R.valTo) + rangeIn('test', 'Test final', R.testFrom, R.testTo) +

    S.notice = { msg: msg, err: !!err };
    var stamp = S.notice;
    setTimeout(function () { if (S.notice === stamp) { S.notice = null; renderHead(); } }, err ? 12000 : 7000);
    renderHead();
  }
  function setTab(t) {
    if (!VIEWS[t]) return;
    S.tab = t;
    try { localStorage.setItem('gls-tab', t); } catch (e) { /* stockage local indisponible */ }
    try { history.replaceState(null, '', '#' + t); } catch (e) { /* cadre sans historique */ }
    render();
    window.scrollTo(0, 0);
  }

  /* ===================== import ===================== */
  function readFile(file) {
    return new Promise(function (ok, ko) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; r.readAsArrayBuffer(file); });
  }
  function handleFiles(list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    var okNames = [], errs = [];
    Promise.all(files.map(function (file) {
      return readFile(file).then(function (buf) {
        var f = makeFile(file.name, decodeBytes(buf), 'local');
        var dup = S.files.filter(function (x) { return x.name === f.name && x.text && x.text.length === f.text.length; })[0];
        if (dup) S.files.splice(S.files.indexOf(dup), 1, Object.assign(f, { origin: dup.origin, assetId: dup.assetId, docId: dup.docId }));
        else S.files.push(f);
        okNames.push(f.name);
      }).catch(function (e) { errs.push(file.name + ' : ' + (e && e.message ? e.message : 'lecture impossible')); });
    })).then(function () {
      S.ver++;
      if (errs.length) note(errs.join(' · '), true);
      else if (okNames.length) note(okNames.length + ' fichier' + (okNames.length > 1 ? 's' : '') + ' analysé' + (okNames.length > 1 ? 's' : '') + (canSave() ? ' sur cet appareil. Onglet Fichiers : « Enregistrer » pour les retrouver sur vos autres appareils.' : '.'));
      if (S.tab === 'fichiers' && okNames.length && !errs.length) S.tab = 'apercu';
      render();
    });
  }

  /* ===================== stockage (claude.ai) ===================== */
  function errText(e) {
    var code = (e && e.code) || '';
    var t = {
      too_large: 'Fichier trop volumineux pour l’enregistrement (20 Mo au maximum). Il reste analysé sur cet appareil.',
      quota_or_state: 'Espace de stockage plein : supprimez d’anciens fichiers enregistrés.',
      quota_exceeded: 'Espace de stockage plein : supprimez d’anciens fichiers enregistrés.',
      rate_limited: 'Trop de demandes rapprochées : réessayez dans un instant.',
      resource_exhausted: 'Trop de demandes rapprochées : réessayez dans un instant.',
      not_granted: 'Enregistrement non autorisé dans cette vue.',
      capability_disabled: 'Enregistrement indisponible dans cette vue.',
      capability_removed: 'Enregistrement indisponible dans cette vue.',
      invalid_argument: 'Écriture refusée : droits insuffisants sur cette page.',
      unsupported_type: 'Type de fichier refusé par le stockage.',
      invalid_request: 'Fichier refusé par le stockage (encodage).',
      store_unavailable: 'Stockage momentanément indisponible : réessayez.',
      unavailable: 'Stockage momentanément indisponible : réessayez.',
      upstream_auth: 'Session expirée : rechargez la page.'
    }[code];
    return t || ('Échec de l’enregistrement' + (code ? ' (' + code + ')' : '') + '.');
  }
  function saveFile(f) {
    var c = S.cloud;
    if (!canSave() || f.origin !== 'local' || f.saving) return Promise.resolve();
    f.saving = true; render();
    var type = f.kind === 'criteres' ? 'application/json' : 'text/csv', blob = new Blob([f.text], { type: type }), up = null;
    if (blob.size > 20 * 1024 * 1024) { f.saving = false; note(f.name + ' : ' + errText({ code: 'too_large' }), true); render(); return Promise.resolve(); }
    var per = f.kind === 'criteres' ? null : filePeriod(f);
    return c.assets.upload(blob, { type: type }).then(function (res) {
      up = res;
      var ref = c.db.collection('data/users/' + c.uid).doc();
      f.docId = ref.id;
      return ref.set({ type: 'fichier', nom: f.name, genre: f.kind, lignes: f.rows.length, octets: res.sizeBytes, assetId: res.id,
        ajoute: new Date().toISOString(), debut: per ? per[0] : '', fin: per ? per[1] : '', actif: true });
    }).then(function () {
      f.origin = 'saved'; f.assetId = up.id;
      note('« ' + f.name + ' » enregistré : il s’ouvrira aussi sur vos autres appareils.');
    }).catch(function (e) {
      if (up) c.assets.delete(up.id).catch(function () { /* fichier orphelin : rien d'autre à faire */ });
      f.docId = null;
      note(f.name + ' : ' + errText(e), true);
    }).then(function () { f.saving = false; render(); });
  }
  function syncSaved() {
    var c = S.cloud, changed = false;
    S.files.slice().forEach(function (f) {
      if (f.origin !== 'saved') return;
      var doc = c.docs.filter(function (x) { return x.assetId === f.assetId; })[0];
      if (!doc || !doc.actif) { S.files.splice(S.files.indexOf(f), 1); changed = true; }
    });
    c.docs.forEach(function (x) {
      if (!x.actif || c.loading[x.assetId] || c.errs[x.assetId]) return;
      if (S.files.some(function (f) { return f.assetId === x.assetId; })) return;
      c.loading[x.assetId] = 1;
      fetch('/_blob/' + x.assetId).then(function (r) {
        if (!r.ok) throw new Error(r.status === 404 ? 'fichier introuvable' : 'erreur ' + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        if (!S.files.some(function (f) { return f.assetId === x.assetId; })) S.files.push(makeFile(x.nom, decodeBytes(buf), 'saved', { assetId: x.assetId, docId: x.id }));
        S.ver++;
      }).catch(function (e) { c.errs[x.assetId] = 'lecture impossible : ' + (e && e.message ? e.message : '?'); })
        .then(function () { delete c.loading[x.assetId]; render(); });
    });
    if (changed) S.ver++;
  }
  function docRef(id) { return S.cloud.db.doc('data/users/' + S.cloud.uid + '/' + id); }
  function toggleDoc(id, on) {
    var x = S.cloud.docs.filter(function (d) { return d.id === id; })[0];
    if (!x) return;
    docRef(id).update({ actif: on }).catch(function (e) { note(errText(e), true); render(); });
  }
  function deleteDoc(id) {
    var c = S.cloud, x = c.docs.filter(function (d) { return d.id === id; })[0];
    if (!x || !c.assets) return;
    if (S.pendingDel !== id) {
      S.pendingDel = id; render();
      setTimeout(function () { if (S.pendingDel === id) { S.pendingDel = null; render(); } }, 5000);
      return;
    }
    S.pendingDel = null;
    c.assets.delete(x.assetId).then(function () { return docRef(id).delete(); }).then(function () {
      S.files = S.files.filter(function (f) { return f.assetId !== x.assetId; });
      S.ver++; note('« ' + x.nom + ' » supprimé.'); render();
    }).catch(function (e) { note(errText(e), true); render(); });
  }
  function initCloud() {
    var cl = window.claude;
    if (!cl || typeof cl.use !== 'function') { S.cloud.state = 'absent'; render(); return; }
    function use(n) { return cl.use(n).catch(function () { return null; }); }
    Promise.all([use('db'), use('user'), use('assets')]).then(function (r) {
      var c = S.cloud;
      c.db = r[0]; c.user = r[1]; c.assets = r[2];
      return c.user ? c.user.id().catch(function () { return null; }) : null;
    }).then(function (uid) {
      var c = S.cloud;
      c.uid = uid;
      if (!c.db || !uid) { c.state = 'indisponible'; render(); return; }
      c.state = 'pret';
      c.db.collection('data/users/' + uid).onSnapshot(function (snap) {
        c.docs = snap.docs.filter(function (x) { return x.exists; }).map(function (x) { return Object.assign({ id: x.id }, x.data()); })
          .filter(function (x) { return x.type === 'fichier' && x.assetId; })
          .sort(function (a, b) { return String(b.ajoute).localeCompare(String(a.ajoute)); });
        c.first = true;
        syncSaved(); render();
      }, function (e) { c.state = 'erreur'; c.err = e && e.code; render(); });
      render();
    });
  }

  /* ===================== événements ===================== */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    var a = b.getAttribute('data-act');
    if (a === 'tab') setTab(b.getAttribute('data-v'));
    else if (a === 'unit') { S.eqUnit = b.getAttribute('data-v'); render(); }
    else if (a === 'resetf') { S.filters = { env: '', family: '', label: '', dir: '', from: '', to: '' }; render(); }
    else if (a === 'save') { var f = S.files.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; if (f) saveFile(f); }
    else if (a === 'saveall') { S.files.filter(function (x) { return x.origin === 'local'; }).reduce(function (p, f) { return p.then(function () { return saveFile(f); }); }, Promise.resolve()); }
    else if (a === 'remove') {
      var id = b.getAttribute('data-id'), g = S.files.filter(function (x) { return x.id === id; })[0];
      if (!g) return;
      if (g.origin === 'saved' && g.docId && S.cloud.state === 'pret') toggleDoc(g.docId, false);
      else { S.files.splice(S.files.indexOf(g), 1); S.ver++; render(); }
    }
    else if (a === 'del') deleteDoc(b.getAttribute('data-doc'));
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, id = t.id || '';
    if (id === 'file-in' || id === 'file-in2') { handleFiles(t.files); t.value = ''; return; }
    if (t.getAttribute('data-act') === 'toggle') { toggleDoc(t.getAttribute('data-doc'), t.checked); return; }
    if (id.indexOf('f-') === 0) { S.filters[id.slice(2)] = t.value; render(); return; }
    if (id.indexOf('p-') === 0) {
      var k = id.slice(2);
      S.proto[k] = t.type === 'checkbox' ? t.checked : t.value;
      render();
    }
  });
  document.addEventListener('dragover', function (ev) { ev.preventDefault(); var z = $('#drop'); if (z) z.classList.add('over'); });
  document.addEventListener('dragleave', function (ev) { if (ev.target === document.documentElement || ev.target.id === 'drop') { var z = $('#drop'); if (z) z.classList.remove('over'); } });
  document.addEventListener('drop', function (ev) { ev.preventDefault(); var z = $('#drop'); if (z) z.classList.remove('over'); if (ev.dataTransfer && ev.dataTransfer.files) handleFiles(ev.dataTransfer.files); });
  var view = $('#view');
  view.addEventListener('pointermove', onChartMove);
  view.addEventListener('pointerleave', hideTip);
  document.addEventListener('scroll', hideTip, { passive: true });
  var lastW = 0, rT = null;
  if (window.ResizeObserver) new ResizeObserver(function () {
    var w = view.clientWidth;
    if (Math.abs(w - lastW) < 4) return;
    lastW = w; clearTimeout(rT); rT = setTimeout(function () { mountCharts(view); }, 120);
  }).observe(view);

  /* ===================== démarrage ===================== */
  var h0 = (location.hash || '').slice(1), saved = null;
  try { saved = localStorage.getItem('gls-tab'); } catch (e) { saved = null; }
  S.tab = VIEWS[h0] ? h0 : (VIEWS[saved] ? saved : 'apercu');
  render();
  initCloud();
})();
</script>
