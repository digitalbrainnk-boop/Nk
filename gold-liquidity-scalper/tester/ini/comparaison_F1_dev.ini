; Modèle de lancement du testeur en ligne de commande :
;   terminal64.exe /config:"C:\chemin\comparaison_F1_dev.ini"
; Clés de la section [Tester] de MetaTrader 5 : vérifier leur prise en charge par
; votre version du terminal. Le fichier ExpertParameters doit se trouver dans
; <dossier de données MT5>\MQL5\Profiles\Tester\.
; Dupliquer ce fichier pour F2..F4 et pour les périodes de validation / test.
[Tester]
Expert=GoldLiquidityScalper\Gold_Liquidity_Scalper.ex5
ExpertParameters=F1_balayage.set
Symbol=XAUUSDm
Period=M1
; 4 = chaque tick basé sur les ticks réels
Model=4
; -1 = délai d'exécution aléatoire
ExecutionMode=-1
Optimization=0
FromDate=2021.01.01
ToDate=2023.12.31
ForwardMode=0
Deposit=1000
Currency=EUR
Leverage=1:200
Report=GLS_F1_dev
ReplaceReport=1
ShutdownTerminal=1
