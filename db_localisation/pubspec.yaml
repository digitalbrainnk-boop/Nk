# DB Localisation — application antivol multi-plateforme.
# Un seul code Flutter → Android, iOS, Web et desktop.
name: db_localisation
description: "Antivol et localisation de VOS propres appareils (console + agent)."
publish_to: "none" # Application privée, pas publiée sur pub.dev.

# Version de l'app (versionName+versionCode côté Android).
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase (backend) ---
  firebase_core: ^3.6.0        # Initialisation Firebase (toutes plateformes).
  firebase_auth: ^5.3.1        # Auth e-mail/mot de passe + Google.
  cloud_firestore: ^5.4.4      # Base de données (appareils, positions, commandes).
  firebase_messaging: ^15.1.3  # FCM : pousser les commandes vers l'agent.
  firebase_storage: ^12.3.3    # Avatars/logos (optionnel).

  # --- Connexion Google ---
  google_sign_in: ^6.2.1

  # --- Identité d'installation (PAS d'IMEI/MAC) ---
  # UUID généré au premier lancement, stocké localement.
  uuid: ^4.5.1
  shared_preferences: ^2.3.2   # Stockage local léger (UUID, consentement, rôle).

  # --- Infos appareil/plateforme (nom, modèle, version appli) ---
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0

  # --- Confort UI ---
  intl: ^0.19.0                # Formatage des dates/heures.

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
