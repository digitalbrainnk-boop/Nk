# Build automatique de l'APK Android de DB Localisation, dans le cloud GitHub.
# But : permettre de tester sans ordinateur. À chaque push (ou lancement manuel),
# GitHub compile l'APK et le met à télécharger dans l'onglet "Actions" du dépôt.
#
# Récupérer l'APK, au choix :
#  - LE PLUS SIMPLE : dépôt GitHub -> onglet "Releases" -> "APK (dernier build)"
#    -> télécharger le fichier .apk directement (pas de .zip).
#  - OU : onglet "Actions" -> dernier run -> "Artifacts" -> "db-localisation-apk"
#    (téléchargé en .zip, à décompresser).
# Installer : ouvrir le .apk et autoriser "installer des applis de sources inconnues".

name: Build APK (DB Localisation)

on:
  push:
    branches: ["ccr-12782980-j0gzjj"]
    paths:
      - "db_localisation/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions.

permissions:
  contents: write # nécessaire pour publier l'APK dans les Releases.

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db_localisation
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17 (requis par le build Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter (canal stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer la scaffolding Android (android/ gradle, etc.)
        run: flutter create . --platforms=android --org com.dblocalisation --project-name db_localisation

      - name: Restaurer notre AndroidManifest (permissions + queries)
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Construire les APK (debug, un par architecture = plus légers)
        run: flutter build apk --debug --split-per-abi

      - name: Renommer les APK (noms lisibles)
        run: |
          # arm64-v8a = quasi tous les téléphones depuis ~2016 (fichier principal).
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk DB-Localisation.apk
          # armeabi-v7a = secours pour les téléphones plus anciens (32 bits).
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk DB-Localisation-ancien-telephone.apk

      - name: Publier l'APK comme artefact téléchargeable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: db-localisation-apk
          path: db_localisation/DB-Localisation.apk
          if-no-files-found: error

      - name: Publier les APK en Release (lien direct, le plus simple)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release "rolling" : on remplace à chaque build pour garder un lien stable.
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest \
            DB-Localisation.apk DB-Localisation-ancien-telephone.apk \
            --title "APK (dernier build) — DB Localisation" \
            --notes "APK de test. Essaie d'abord DB-Localisation.apk. Si ton téléphone est ancien (32 bits) et refuse, prends DB-Localisation-ancien-telephone.apk."
