# DB.Mélo : compile le paquet prêt à installer chez o2switch et le publie ici :
#   https://github.com/digitalbrainnk-boop/Nk/releases/download/dbmelo-o2switch/dbmelo-o2switch.tar.gz
# Le serveur l'installe avec db-melo/deploy/o2switch/installer.sh (commande « dbmelo-maj »).
name: DB.Mélo — paquet o2switch

on:
  push:
    branches: [claude/db-melo-saas-app-14k2yw]
    paths: ["db-melo/**", ".github/workflows/dbmelo-o2switch.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dbmelo-o2switch
  cancel-in-progress: true

jobs:
  # Application Android (db-melo/android, Trusted Web Activity) : compilée non signée, le serveur la
  # signe avec sa propre clé. Recompilée seulement quand le projet Android change.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v4
        with:
          path: android-apk
          key: dbmelo-android-${{ hashFiles('db-melo/android/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Compilation de l'application Android
        working-directory: db-melo/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p "$GITHUB_WORKSPACE/android-apk"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/android-apk/dbmelo-non-signee.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-apk/dbmelo-non-signee.apk

  paquet:
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db-melo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db-melo/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: db-melo/android-apk
      - name: Signature de l'application Android vérifiée par apksigner
        run: |
          node --experimental-strip-types --no-warnings scripts/signer-apk-essai.mts android-apk/dbmelo-non-signee.apk "$RUNNER_TEMP/essai.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c 4 android-apk/dbmelo-non-signee.apk
          "$BT/apksigner" verify --verbose --min-sdk-version 24 "$RUNNER_TEMP/essai.apk"
          "$BT/aapt2" dump badging "$RUNNER_TEMP/essai.apk" | head -5
      - name: Compilation (paquet autonome)
        run: npx next build
        env:
          NEXT_OUTPUT: standalone
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Assemblage
        run: bash deploy/o2switch/paquet.sh "$RUNNER_TEMP/dbmelo-o2switch.tar.gz"
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view dbmelo-o2switch >/dev/null 2>&1 || gh release create dbmelo-o2switch \
            --prerelease --target "$GITHUB_SHA" --title "DB.Mélo pour o2switch" \
            --notes "Paquet prêt à installer avec db-melo/deploy/o2switch/installer.sh, mis à jour à chaque modification de DB.Mélo."
          gh release upload dbmelo-o2switch "$RUNNER_TEMP/dbmelo-o2switch.tar.gz" --clobber
